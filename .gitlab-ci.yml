image: python:3.12-slim

stages: [verify, secure, package]

variables:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "duo_workflow"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'

.branch-and-mr:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'

unit-and-adversarial:
  extends: .branch-and-mr
  stage: verify
  script:
    - python -m unittest discover -s tests -v
    - python -m compileall -q flakewise api

frontend-syntax:
  extends: .branch-and-mr
  stage: verify
  image: node:22-slim
  script:
    - node --input-type=module --check < public/app.js

bounded-security-check:
  extends: .branch-and-mr
  stage: secure
  script:
    - python scripts/ci_security_scan.py

# The policy script comes from the target branch, not the agent's source branch.
repair-scope:
  stage: secure
  image: python:3.12
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^repair\//'
  script:
    - git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - export FLAKEWISE_BASE_SHA=$(git rev-parse "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME")
    - git show "$FLAKEWISE_BASE_SHA:scripts/ci_repair_scope.py" > /tmp/flakewise-trusted-scope.py
    - python /tmp/flakewise-trusted-scope.py "$FLAKEWISE_BASE_SHA"

source-package:
  extends: .branch-and-mr
  stage: package
  image: python:3.12
  script:
    - mkdir -p artifacts
    - git archive --format=zip --output=artifacts/flakewise-source.zip HEAD
  artifacts:
    expire_in: 30 days
    paths: [artifacts/flakewise-source.zip]
